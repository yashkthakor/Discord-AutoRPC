[package]
name = "discord-autorpc-desktop"
version = "0.2.0"
description = "Discord AutoRPC desktop shell (Tauri 2) — replaces the PyQt6 GUI"
authors = ["yashkthakor"]
license = "MIT"
publish = false
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Plugin versions were verified on 2026-10-18 (see GUI_HANDOFF_TAURI_REACT.md §2).
# Carets let cargo take the newest compatible 2.x.
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
