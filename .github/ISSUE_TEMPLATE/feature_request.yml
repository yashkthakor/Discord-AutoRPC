name: Feature Request
description: Suggest an idea or enhancement for Discord AutoRPC
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea or a new application you want supported? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: A clear and concise description of what the problem or limitation is.
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: A clear description of the feature or behavior you would like to see.
    validations:
      required: true
